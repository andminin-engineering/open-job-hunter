services:
  mcp-backend:
    image: open-job-hunter:local
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/data:/app/data
    ports:
      # The API has no authentication (local-trust model): publish it on the host's loopback only.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SCHEDULER_ENABLED=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    extra_hosts:
      - "host.docker.internal:host-gateway"
